app = "halden-gtm-desk"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  HALDEN_DAILY_CAP = "40"
  HALDEN_IP_HOURLY_CAP = "5"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
