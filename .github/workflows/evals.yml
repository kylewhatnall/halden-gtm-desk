name: evals
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per case"
        default: "1"
jobs:
  live-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run live evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run.py --live -n ${{ github.event.inputs.runs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: evals/results/*.md
